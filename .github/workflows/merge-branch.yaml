name: Main Branch Pipeline

on:
  push:
    branches:
      - main

# Only allow one deployment at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  merge-pipeline:
    name: Build, Test, and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: go mod download

      - name: Run merge branch pipeline
        id: pipeline
        uses: ./.github/actions/merge-branch
        with:
          workspace: ${{ github.workspace }}
          node-version: '18'
          go-version: '1.21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          registry: 'ghcr.io'
          registry-username: ${{ github.actor }}
          create-release: 'true'

      - name: Output results
        run: |
          echo "Frontend Image: ${{ steps.pipeline.outputs.frontend-image }}"
          echo "Backend Image: ${{ steps.pipeline.outputs.backend-image }}"
          echo "Release Tag: ${{ steps.pipeline.outputs.release-tag }}"
          echo "Release URL: ${{ steps.pipeline.outputs.release-url }}"

      - name: Notify deployment
        if: success()
        run: |
          echo "::notice title=Deployment Ready::Images pushed and release created. Version: ${{ steps.pipeline.outputs.release-tag }}"
